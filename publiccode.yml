publiccodeYmlVersion: "0.4"
name: FPSOT vocabularies specification
url: "https://github.com/fpsot-org/fpsot-spec-vocabularies"
platforms:
  - web
categories:
  - it-development
developmentStatus: concept
softwareType: "standalone/other"
description:
  en:
    shortDescription: Controlled vocabulary rules for FPSOT projects.
    longDescription: >
      Rules for publishing code lists, classifications and thesauri as W3C
      SKOS concept schemes: stable URIs and codes, labels and definitions in
      English and French, hierarchy and collections, deprecation and
      versions, mappings to the schemes of other bodies, Turtle, JSON-LD and
      CSV files, and binding in LinkML models.
    features:
      - SKOS concept schemes with stable URIs and codes
      - English and French labels and definitions
      - Deprecation without deletion
      - LinkML enums bound to concept URIs
  fr:
    shortDescription: Règles sur les vocabulaires contrôlés des projets FPSOT.
    longDescription: >
      Règles pour publier des listes de codes, des classifications et des
      thésaurus comme schémas de concepts SKOS du W3C : URI et codes stables,
      libellés et définitions en anglais et en français, hiérarchie et
      collections, concepts déconseillés et versions, correspondances avec
      les schémas d'autres organismes, fichiers Turtle, JSON-LD et CSV, et
      liaison dans les modèles LinkML.
    features:
      - Schémas de concepts SKOS avec URI et codes stables
      - Libellés et définitions en anglais et en français
      - Concepts déconseillés sans suppression
      - Énumérations LinkML liées aux URI des concepts
