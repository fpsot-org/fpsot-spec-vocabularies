# Comparison data. The format is defined by fpsot-spec-doc (model/jurisdiction.yaml).
topics:
  identity: {en: Addresses of concepts, fr: Adresses des concepts}
  codes: {en: Codes, fr: Codes}
  labels: {en: Labels, fr: Libellés}
  definitions: {en: Definitions, fr: Définitions}
  hierarchy: {en: Hierarchy, fr: Hiérarchie}
  lifecycle: {en: Deprecation and change notes, fr: Concepts déconseillés et notes de modification}
  versions: {en: Scheme versions, fr: Versions des schémas}
  mappings: {en: Reuse and mappings, fr: Réutilisation et correspondances}
  publishing: {en: Published files, fr: Fichiers publiés}
  binding: {en: Binding in data models, fr: Liaison dans les modèles de données}
rows:
  - id: VOC-004
    topic: identity
    requirement: {en: "A published URI names the same concept forever and is never reused.", fr: "Une URI publiée désigne toujours le même concept et n’est jamais réutilisée."}
    international: {en: "SKOS names each scheme and concept with a URI. It sets no rule on keeping or reusing those URIs.", fr: "Le SKOS désigne chaque schéma et chaque concept par une URI. Il ne fixe aucune règle sur la conservation ou la réutilisation de ces URI."}
    international_source: {title: "SKOS Simple Knowledge Organization System Reference", version: "W3C Recommendation", date: "2009-08-18", url: "https://www.w3.org/TR/skos-reference/", archive: "SKOSREF_ARCHIVE"}
    fpsot: {en: "The URI never changes and never names anything else, even after a deprecation.", fr: "L’URI ne change jamais et ne désigne jamais autre chose, même après que le concept est déconseillé."}
  - id: VOC-005
    topic: codes
    requirement: {en: "Each concept has one plain notation, the code that data stores.", fr: "Chaque concept a une seule notation simple, le code que les données conservent."}
    international: {en: "By convention, a notation carries a datatype that names its code system, and two concepts of one scheme do not share a notation.", fr: "Par convention, une notation porte un type de données qui nomme son système de codes, et deux concepts d’un même schéma ne partagent pas une notation."}
    international_source: {title: "SKOS Simple Knowledge Organization System Reference", version: "W3C Recommendation", date: "2009-08-18", url: "https://www.w3.org/TR/skos-reference/", archive: "SKOSREF_ARCHIVE"}
    fpsot: {en: "Exactly one plain string notation per concept, unique in the scheme. Other code systems may add typed notations.", fr: "Exactement une notation en chaîne simple par concept, unique dans le schéma. D’autres systèmes de codes peuvent ajouter des notations typées."}
  - id: VOC-006
    topic: codes
    requirement: {en: "A code from another issuer keeps the exact form of that issuer.", fr: "Un code d’un autre émetteur garde la forme exacte de cet émetteur."}
    international: {en: "The EU country table bases its codes on ISO 3166-1 where it can, and keeps the ISO codes as notations.", fr: "La table des pays de l’UE fonde ses codes sur l’ISO 3166-1 quand c’est possible, et garde les codes ISO comme notations."}
    international_source: {title: "EU Vocabularies, Authority tables", version: "Release 20260923-0", date: "2026-09-23", url: "https://op.europa.eu/en/web/eu-vocabularies/authority-tables", archive: "EUAT_ARCHIVE"}
    fpsot: {en: "Codes that FPSOT or the publisher defines are kebab-case English. Codes of other issuers keep their form, such as QC.", fr: "Les codes que la FPSOT ou l’éditeur définit sont en anglais et en kebab-case. Les codes d’autres émetteurs gardent leur forme, comme QC."}
  - id: VOC-007
    topic: codes
    requirement: {en: "A code never changes and is never given to another concept.", fr: "Un code ne change jamais et n’est jamais donné à un autre concept."}
    international: {en: "SKOS sets no rule on changing a notation. Codes stay unique within a scheme by convention only.", fr: "Le SKOS ne fixe aucune règle sur le changement d’une notation. Les codes restent uniques dans un schéma par simple convention."}
    international_source: {title: "SKOS Simple Knowledge Organization System Reference", version: "W3C Recommendation", date: "2009-08-18", url: "https://www.w3.org/TR/skos-reference/", archive: "SKOSREF_ARCHIVE"}
    fpsot: {en: "A new code needs a new concept, and the old one is deprecated. This holds across major versions.", fr: "Un nouveau code demande un nouveau concept, et l’ancien est déconseillé. Cela vaut d’une version majeure à l’autre."}
  - id: VOC-010
    topic: labels
    requirement: {en: "Each concept has one preferred label in English and one in French.", fr: "Chaque concept a un libellé préférentiel en anglais et un en français."}
    international: {en: "A resource has at most one preferred label per language tag. No language is required.", fr: "Une ressource a au plus un libellé préférentiel par étiquette de langue. Aucune langue n’est exigée."}
    international_source: {title: "SKOS Simple Knowledge Organization System Reference", version: "W3C Recommendation", date: "2009-08-18", url: "https://www.w3.org/TR/skos-reference/", archive: "SKOSREF_ARCHIVE"}
    fpsot: {en: "Exactly one preferred label tagged en and one tagged fr, on each scheme, concept and collection.", fr: "Exactement un libellé préférentiel étiqueté en et un étiqueté fr, sur chaque schéma, concept et collection."}
  - id: VOC-013
    topic: labels
    requirement: {en: "One text is never in two label kinds of one concept.", fr: "Un même texte ne figure jamais dans deux genres de libellés d’un même concept."}
    international: {en: "Preferred, alternative and hidden labels are pairwise disjoint.", fr: "Les libellés préférentiels, alternatifs et cachés sont disjoints deux à deux."}
    international_source: {title: "SKOS Simple Knowledge Organization System Reference", version: "W3C Recommendation", date: "2009-08-18", url: "https://www.w3.org/TR/skos-reference/", archive: "SKOSREF_ARCHIVE"}
    fpsot: {en: "The same condition, for each concept and each language.", fr: "La même condition, pour chaque concept et chaque langue."}
  - id: VOC-015
    topic: definitions
    requirement: {en: "Each concept has a definition in English and in French.", fr: "Chaque concept a une définition en anglais et en français."}
    international: {en: "A definition is one of several optional documentation properties.", fr: "La définition est une des propriétés de documentation facultatives."}
    international_source: {title: "SKOS Simple Knowledge Organization System Reference", version: "W3C Recommendation", date: "2009-08-18", url: "https://www.w3.org/TR/skos-reference/", archive: "SKOSREF_ARCHIVE"}
    fpsot: {en: "A plain-language definition in both languages, required for each concept.", fr: "Une définition en langage clair dans les deux langues, exigée pour chaque concept."}
  - id: VOC-022
    topic: hierarchy
    requirement: {en: "Broader links form no cycle, and a concept should have one broader concept.", fr: "Les liens génériques ne forment pas de cycle, et un concept devrait avoir un seul concept générique."}
    international: {en: "A cycle of broader links is consistent with the SKOS model, and a concept may have several broader concepts. Applications decide how to treat cycles.", fr: "Un cycle de liens génériques est cohérent avec le modèle SKOS, et un concept peut avoir plusieurs concepts génériques. Les applications décident comment traiter les cycles."}
    international_source: {title: "SKOS Simple Knowledge Organization System Reference", version: "W3C Recommendation", date: "2009-08-18", url: "https://www.w3.org/TR/skos-reference/", archive: "SKOSREF_ARCHIVE"}
    fpsot: {en: "No cycle. One broader concept by default, more only when the concept truly belongs under each.", fr: "Aucun cycle. Un seul concept générique par défaut, plus seulement quand le concept relève vraiment de chacun."}
  - id: VOC-023
    topic: hierarchy
    requirement: {en: "Related links never join two concepts on one broader chain.", fr: "Les liens associatifs ne joignent jamais deux concepts d’une même chaîne générique."}
    international: {en: "The related property is disjoint with the transitive broader property.", fr: "La propriété associative est disjointe de la propriété générique transitive."}
    international_source: {title: "SKOS Simple Knowledge Organization System Reference", version: "W3C Recommendation", date: "2009-08-18", url: "https://www.w3.org/TR/skos-reference/", archive: "SKOSREF_ARCHIVE"}
    fpsot: {en: "The same condition. Broader also means a kind, a part or an instance.", fr: "La même condition. Le lien générique signifie aussi une sorte, une partie ou une instance."}
  - id: VOC-030
    topic: lifecycle
    requirement: {en: "A published concept is never deleted.", fr: "Un concept publié n’est jamais supprimé."}
    international: {en: "The EU authority tables publish concepts with the statuses current, deprecated and retired.", fr: "Les tables d’autorité de l’UE publient des concepts dont l’état est courant, déconseillé ou retiré."}
    international_source: {title: "EU Vocabularies, Authority tables", version: "Release 20260923-0", date: "2026-09-23", url: "https://op.europa.eu/en/web/eu-vocabularies/authority-tables", archive: "EUAT_ARCHIVE"}
    fpsot: {en: "Every later release keeps the concept, with its URI, code, labels and definition.", fr: "Chaque version suivante garde le concept, avec son URI, son code, ses libellés et sa définition."}
  - id: VOC-031
    topic: lifecycle
    requirement: {en: "A retired concept is marked as deprecated and linked to its replacement.", fr: "Un concept retiré de l’usage est marqué comme déconseillé et relié à son remplaçant."}
    international: {en: "The EU country table marks Netherlands Antilles as deprecated, with an end date, a change note and three replacements.", fr: "La table des pays de l’UE marque les Antilles néerlandaises comme déconseillées, avec une date de fin, une note de modification et trois remplaçants."}
    international_source: {title: "EU Vocabularies, Country authority table, concept ANT", version: "Release 20260923-0", date: "2026-09-23", url: "http://publications.europa.eu/resource/authority/country/ANT", archive: "ANT_ARCHIVE"}
    fpsot: {en: "owl:deprecated true, a change note in both languages, and dct:isReplacedBy with dct:replaces.", fr: "owl:deprecated true, une note de modification dans les deux langues, et dct:isReplacedBy avec dct:replaces."}
  - id: VOC-034
    topic: lifecycle
    requirement: {en: "Each change to a concept adds a dated change note in both languages.", fr: "Chaque changement à un concept ajoute une note de modification datée dans les deux langues."}
    international: {en: "A change note is an optional documentation property, with no set form.", fr: "La note de modification est une propriété de documentation facultative, sans forme fixe."}
    international_source: {title: "SKOS Simple Knowledge Organization System Reference", version: "W3C Recommendation", date: "2009-08-18", url: "https://www.w3.org/TR/skos-reference/", archive: "SKOSREF_ARCHIVE"}
    fpsot: {en: "A note that starts with the date and the release version, plus dct:modified on the concept.", fr: "Une note qui commence par la date et le numéro de version, et dct:modified sur le concept."}
  - id: VOC-035
    topic: versions
    requirement: {en: "Each release of a scheme has a version number and a date.", fr: "Chaque version d’un schéma a un numéro de version et une date."}
    international: {en: "The EU authority tables number each release by its date, such as 20260923-0.", fr: "Les tables d’autorité de l’UE numérotent chaque version par sa date, comme 20260923-0."}
    international_source: {title: "EU Vocabularies, Authority tables", version: "Release 20260923-0", date: "2026-09-23", url: "https://op.europa.eu/en/web/eu-vocabularies/authority-tables", archive: "EUAT_ARCHIVE"}
    fpsot: {en: "Semantic Versioning in owl:versionInfo, and the date in dct:modified. No release may remove anything.", fr: "Gestion sémantique de version dans owl:versionInfo, et la date dans dct:modified. Aucune version ne peut retirer quoi que ce soit."}
  - id: VOC-040
    topic: mappings
    requirement: {en: "A project reuses the scheme of an authority before it creates its own.", fr: "Un projet réutilise le schéma d’une autorité avant de créer le sien."}
    international: {en: "The EU authority tables exist to harmonize codes and labels across the systems of the EU institutions.", fr: "Les tables d’autorité de l’UE existent pour harmoniser les codes et les libellés entre les systèmes des institutions de l’UE."}
    international_source: {title: "EU Vocabularies, Authority tables", version: "Release 20260923-0", date: "2026-09-23", url: "https://op.europa.eu/en/web/eu-vocabularies/authority-tables", archive: "EUAT_ARCHIVE"}
    fpsot: {en: "Reuse an authority scheme where one exists. Otherwise map the new scheme to it.", fr: "Réutiliser un schéma d’autorité s’il en existe un. Sinon, établir des correspondances entre le nouveau schéma et celui-là."}
  - id: VOC-041
    topic: mappings
    requirement: {en: "A mapping uses the property that matches how close the concepts are.", fr: "Une correspondance emploie la propriété qui exprime à quel point les concepts sont proches."}
    international: {en: "Exact matches chain across schemes, close matches do not. Broad, narrow and related matches cover the other cases.", fr: "Les correspondances exactes s’enchaînent d’un schéma à l’autre, mais pas les correspondances proches. Les correspondances plus larges, plus étroites et associatives couvrent les autres cas."}
    international_source: {title: "SKOS Simple Knowledge Organization System Reference", version: "W3C Recommendation", date: "2009-08-18", url: "https://www.w3.org/TR/skos-reference/", archive: "SKOSREF_ARCHIVE"}
    fpsot: {en: "Exact match only when the concepts can replace each other in every use. A doubtful pair is a close match.", fr: "Correspondance exacte seulement quand les concepts peuvent se remplacer dans tout emploi. Une paire douteuse est une correspondance proche."}
  - id: VOC-050
    topic: publishing
    requirement: {en: "Each release is published as Turtle and as JSON-LD.", fr: "Chaque version est publiée en Turtle et en JSON-LD."}
    international: {en: "A SKOS scheme is RDF data, so any RDF syntax can carry it.", fr: "Un schéma SKOS est un ensemble de données RDF, donc toute syntaxe RDF peut le porter."}
    international_source: {title: "SKOS Simple Knowledge Organization System Reference", version: "W3C Recommendation", date: "2009-08-18", url: "https://www.w3.org/TR/skos-reference/", archive: "SKOSREF_ARCHIVE"}
    fpsot: {en: "Turtle and JSON-LD 1.1, with the same statements, in UTF-8.", fr: "Turtle et JSON-LD 1.1, avec les mêmes énoncés, en UTF-8."}
  - id: VOC-052
    topic: publishing
    requirement: {en: "Each release is also published as a CSV file for people.", fr: "Chaque version est aussi publiée en fichier CSV pour les personnes."}
    international: {en: "RFC 4180 describes the common CSV format: one record per line, commas between fields and an optional header line.", fr: "Le RFC 4180 décrit le format CSV courant : un enregistrement par ligne, des virgules entre les champs et une ligne d’en-tête facultative."}
    international_source: {title: "RFC 4180, Common Format and MIME Type for Comma-Separated Values (CSV) Files", date: "2005-10", url: "https://www.rfc-editor.org/info/rfc4180", archive: "RFC4180_ARCHIVE"}
    fpsot: {en: "A header row and nine fixed columns, one row per concept, deprecated ones included.", fr: "Une ligne d’en-tête et neuf colonnes fixes, une ligne par concept, y compris les concepts déconseillés."}
  - id: VOC-061
    topic: binding
    requirement: {en: "Each permissible value of an enumeration points to its concept URI.", fr: "Chaque valeur permise d’une énumération pointe vers l’URI de son concept."}
    international: {en: "In LinkML, the meaning of a permissible value is a URI or a short form that gives its sense.", fr: "En LinkML, le sens d’une valeur permise est une URI ou une forme courte qui donne sa signification."}
    international_source: {title: "LinkML, Enums", version: "1.12.1", url: "https://linkml.io/linkml/schemas/enums.html", archive: "LINKMLENUM_ARCHIVE"}
    fpsot: {en: "The name of the value is the code, its meaning is the concept URI, and enum_uri is the scheme URI.", fr: "Le nom de la valeur est le code, son sens est l’URI du concept, et enum_uri est l’URI du schéma."}
